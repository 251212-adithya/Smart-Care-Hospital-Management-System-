version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: smartcare_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Adithya@2005
      MYSQL_DATABASE: smartcare_hms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartcare-network
    command: --default-authentication-plugin=mysql_native_password

  smartcare-backend:
    build: 
      context: ./smartcare-hms
      dockerfile: Dockerfile
    container_name: smartcare_backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql-db
    depends_on:
      - mysql-db
    networks:
      - smartcare-network

networks:
  smartcare-network:
    driver: bridge

volumes:
  mysql_data:
