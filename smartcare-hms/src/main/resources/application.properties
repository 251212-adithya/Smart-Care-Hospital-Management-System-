spring.datasource.url=jdbc:mysql://localhost:3306/smartcare_hms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Adithya@2005

# Let Hibernate update tables (creates them if they don't exist, keeps existing data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Keep Hibernate session open during HTTP response serialization (prevents LazyInitializationException)
spring.jpa.open-in-view=true

# Defer datasource initialization so Hibernate creates tables before data.sql runs
spring.jpa.defer-datasource-initialization=true

# Load sample data on startup (only inserts if tables are empty)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql